name: CI — Quality Gates

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  quality:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint tests y módulos auth (incremental)
        run: >
          cd frontend && npx eslint
          tests/
          src/lib/auth.ts
          src/lib/strapi-local-auth.ts
          "src/app/(auth)/login/page.tsx"

      - name: Unit + integration tests
        run: npm run test:fast
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Production build
        run: npm run build:all

  e2e-smoke:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: quality
    env:
      PLAYWRIGHT_TEST: '1'
      NEXT_PUBLIC_PLAYWRIGHT_TEST: '1'
      PLAYWRIGHT_SMOKE_ONLY: '1'
      NEXT_PUBLIC_STRAPI_URL: ${{ secrets.NEXT_PUBLIC_STRAPI_URL }}
      NEXTAUTH_SECRET: ci-smoke-nextauth-secret-not-for-production
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: npm run test:e2e:smoke

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-smoke-report
          path: frontend/playwright-report/
          retention-days: 14
